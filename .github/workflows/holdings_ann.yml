name: Holdings Announcements 7PM
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 16 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Debug - List files
        run: |
          echo "=== FILES ==="
          ls -la
          echo "=== REQUIREMENTS ==="
          cat requirements.txt || echo "NO requirements.txt"
          echo "=== CHECK PYTHON FILE ==="
          ls -lh announcements_holdings.py holdings.json sent_history.json || echo "MISSING FILE"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python announcements_holdings.py
        env:
          TELEGRAM_TOKEN_HOLDINGS: ${{ secrets.TELEGRAM_TOKEN_HOLDINGS }}
          TELEGRAM_CHAT_ID_HOLDINGS: ${{ secrets.TELEGRAM_CHAT_ID_HOLDINGS }}
      - name: Save sent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json || true
          git commit -m "Update sent history" || echo "No changes"
          git push || echo "Push failed - ignore"
