name: Holdings Announcements 7PM
on:
  schedule:
    # 7 PM IST = 13:30 UTC - Main Run
    - cron: '30 13 * * *'
    # 10 PM IST = 16:30 UTC - Late Evening Run
    - cron: '30 16 * * *'
    # 8 AM IST = 02:30 UTC - Morning Catch-up Run
    - cron: '30 2 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python announcements_holdings.py
        env:
          TELEGRAM_TOKEN_HOLDINGS: ${{ secrets.TELEGRAM_TOKEN_HOLDINGS }}
          TELEGRAM_CHAT_ID_HOLDINGS: ${{ secrets.TELEGRAM_CHAT_ID_HOLDINGS }}
      - name: Save sent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json || true
          git commit -m "Update sent history $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push || echo "Push failed"
